# Runs on every pull request targeting main or dev.
# The two jobs run in parallel — both must pass before merging.
name: Frontend Linting

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      # Check out the repository so the workflow can access the code.
      - name: Checkout code
        uses: actions/checkout@v6

      # Set up Node.js with npm caching to speed up dependency installation.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      # Install exact versions from package-lock.json — no version drift.
      - name: Install dependencies
        run: npm ci

      # Fail if any ESLint rule is violated.
      - name: Run ESLint
        run: npm run lint

      # Fail if TypeScript finds any type errors (does not emit files).
      - name: Type check
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Verify that the app compiles successfully for production.
      - name: Build app
        run: npm run build
